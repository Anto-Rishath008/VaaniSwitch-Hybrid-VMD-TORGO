[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="components-final-hybrid-vmd-torgo"
version="1.0.0"
description="Shared-VMD token-level hybrid dysarthria classification and English reconstruction"
requires-python=">=3.11"
dependencies=[
    "numpy>=1.26,<2.0",
    "PyYAML>=6.0",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev=[
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
vaaniswitch-preprocess="components.preprocess:main"
vaaniswitch-train="components.train:main"
vaaniswitch-test="components.test:main"
vaaniswitch-app="components.app:main"

[tool.setuptools.packages.find]
where=["."]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra --strict-config --strict-markers"
pythonpath=["src"]

[tool.coverage.run]
branch=true
source=["components.data", "components.vmd", "components.representations"]

[tool.coverage.report]
fail_under=80
show_missing=true
skip_covered=true

[tool.ruff]
line-length=100
target-version="py311"

[tool.ruff.lint]
select=["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version="3.11"
files=[
    "src/components/data",
    "src/components/vmd",
    "src/components/representations",
    "tests/data",
    "tests/vmd",
    "tests/representations",
]
strict=true
warn_unused_configs=true

[[tool.mypy.overrides]]
module="yaml"
ignore_missing_imports=true
